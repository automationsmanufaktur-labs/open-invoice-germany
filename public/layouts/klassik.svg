<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170">
  <title>Klassik</title>
  <rect x="0.5" y="0.5" width="119" height="169" fill="#ffffff" stroke="#e5e7eb"/>
  <!-- Logo oben links -->
  <rect x="8" y="8" width="24" height="10" rx="1" fill="#d1d5db"/>
  <!-- Firmenname oben rechts -->
  <rect x="70" y="10" width="42" height="4" fill="#1f2937"/>
  <!-- Doppellinie unter dem Kopf -->
  <line x1="8" y1="26" x2="112" y2="26" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="8" y1="28.5" x2="112" y2="28.5" stroke="#1f2937" stroke-width="0.5"/>
  <!-- Adressblock links (4 Zeilen) -->
  <g fill="#9ca3af">
    <rect x="8" y="36" width="36" height="2"/>
    <rect x="8" y="41" width="30" height="2"/>
    <rect x="8" y="46" width="32" height="2"/>
    <rect x="8" y="51" width="24" height="2"/>
  </g>
  <!-- Infoblock rechts: Titel + 3 Meta-Zeilen -->
  <g>
    <rect x="70" y="36" width="42" height="4" fill="#1f2937"/>
    <rect x="70" y="43" width="36" height="2" fill="#9ca3af"/>
    <rect x="70" y="48" width="38" height="2" fill="#9ca3af"/>
    <rect x="70" y="53" width="30" height="2" fill="#9ca3af"/>
  </g>
  <!-- Tabellenkopf: nur Linie -->
  <line x1="8" y1="76" x2="112" y2="76" stroke="#999999" stroke-width="0.6"/>
  <!-- 6 Positionszeilen -->
  <g fill="#d1d5db">
    <rect x="8" y="82" width="60" height="2"/>
    <rect x="92" y="82" width="20" height="2"/>
    <rect x="8" y="90" width="55" height="2"/>
    <rect x="92" y="90" width="20" height="2"/>
    <rect x="8" y="98" width="62" height="2"/>
    <rect x="92" y="98" width="20" height="2"/>
    <rect x="8" y="106" width="50" height="2"/>
    <rect x="92" y="106" width="20" height="2"/>
    <rect x="8" y="114" width="58" height="2"/>
    <rect x="92" y="114" width="20" height="2"/>
    <rect x="8" y="122" width="52" height="2"/>
    <rect x="92" y="122" width="20" height="2"/>
  </g>
  <!-- Summen rechts -->
  <rect x="76" y="134" width="36" height="2" fill="#9ca3af"/>
  <rect x="76" y="139" width="36" height="2.5" fill="#1f2937"/>
  <!-- Fusszeile: Linie + drei Spalten grau -->
  <line x1="8" y1="150" x2="112" y2="150" stroke="#999999" stroke-width="0.4"/>
  <g fill="#9ca3af">
    <rect x="8" y="154" width="28" height="1.5"/>
    <rect x="8" y="158" width="24" height="1.5"/>
    <rect x="46" y="154" width="28" height="1.5"/>
    <rect x="46" y="158" width="24" height="1.5"/>
    <rect x="84" y="154" width="28" height="1.5"/>
    <rect x="84" y="158" width="24" height="1.5"/>
  </g>
</svg>
