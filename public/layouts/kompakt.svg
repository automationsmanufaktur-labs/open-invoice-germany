<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170">
  <title>Kompakt</title>
  <rect x="0.5" y="0.5" width="119" height="169" fill="#ffffff" stroke="#e5e7eb"/>
  <!-- Logo oben rechts -->
  <rect x="88" y="8" width="24" height="10" rx="1" fill="#d1d5db"/>
  <!-- Adressblock links (4 Zeilen) -->
  <g fill="#9ca3af">
    <rect x="8" y="30" width="36" height="2"/>
    <rect x="8" y="35" width="30" height="2"/>
    <rect x="8" y="40" width="32" height="2"/>
    <rect x="8" y="45" width="24" height="2"/>
  </g>
  <!-- Infoblock rechts (4 Zeilen) -->
  <g fill="#9ca3af">
    <rect x="72" y="30" width="40" height="2"/>
    <rect x="72" y="35" width="34" height="2"/>
    <rect x="72" y="40" width="38" height="2"/>
    <rect x="72" y="45" width="28" height="2"/>
  </g>
  <!-- Titel -->
  <rect x="60" y="55" width="52" height="4" fill="#374151"/>
  <!-- Tabellenkopf (niedrigerer Balken — kleinere Schrift/Zeilenhoehe) -->
  <rect x="8" y="68" width="104" height="6" fill="#374151"/>
  <!-- 9 duenne Positionszeilen (statt 6 bei den anderen Layouts) -->
  <g fill="#d1d5db">
    <rect x="8" y="78" width="60" height="1.5"/>
    <rect x="92" y="78" width="20" height="1.5"/>
    <rect x="8" y="83.5" width="55" height="1.5"/>
    <rect x="92" y="83.5" width="20" height="1.5"/>
    <rect x="8" y="89" width="62" height="1.5"/>
    <rect x="92" y="89" width="20" height="1.5"/>
    <rect x="8" y="94.5" width="50" height="1.5"/>
    <rect x="92" y="94.5" width="20" height="1.5"/>
    <rect x="8" y="100" width="58" height="1.5"/>
    <rect x="92" y="100" width="20" height="1.5"/>
    <rect x="8" y="105.5" width="52" height="1.5"/>
    <rect x="92" y="105.5" width="20" height="1.5"/>
    <rect x="8" y="111" width="56" height="1.5"/>
    <rect x="92" y="111" width="20" height="1.5"/>
    <rect x="8" y="116.5" width="48" height="1.5"/>
    <rect x="92" y="116.5" width="20" height="1.5"/>
    <rect x="8" y="122" width="54" height="1.5"/>
    <rect x="92" y="122" width="20" height="1.5"/>
  </g>
  <g stroke="#eeeeee" stroke-width="0.5">
    <line x1="8" y1="81" x2="112" y2="81"/>
    <line x1="8" y1="86.5" x2="112" y2="86.5"/>
    <line x1="8" y1="92" x2="112" y2="92"/>
    <line x1="8" y1="97.5" x2="112" y2="97.5"/>
    <line x1="8" y1="103" x2="112" y2="103"/>
    <line x1="8" y1="108.5" x2="112" y2="108.5"/>
    <line x1="8" y1="114" x2="112" y2="114"/>
    <line x1="8" y1="119.5" x2="112" y2="119.5"/>
    <line x1="8" y1="125" x2="112" y2="125"/>
  </g>
  <!-- Summen rechts -->
  <line x1="76" y1="130" x2="112" y2="130" stroke="#374151" stroke-width="1.2"/>
  <rect x="76" y="133" width="36" height="1.5" fill="#9ca3af"/>
  <rect x="76" y="137.5" width="36" height="2" fill="#1f2937"/>
  <!-- Fusszeile: dunkle Trennlinie, drei Spalten -->
  <line x1="8" y1="150" x2="112" y2="150" stroke="#374151" stroke-width="0.6"/>
  <g fill="#555555">
    <rect x="8" y="154" width="28" height="1.5"/>
    <rect x="8" y="158" width="24" height="1.5"/>
    <rect x="8" y="162" width="26" height="1.5"/>
    <rect x="46" y="154" width="28" height="1.5"/>
    <rect x="46" y="158" width="24" height="1.5"/>
    <rect x="84" y="154" width="28" height="1.5"/>
    <rect x="84" y="158" width="24" height="1.5"/>
  </g>
</svg>
