<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170">
  <title>Modern</title>
  <rect x="0.5" y="0.5" width="119" height="169" fill="#ffffff" stroke="#e5e7eb"/>
  <!-- Kopfbalken in Primaerfarbe -->
  <rect x="0" y="0" width="120" height="20" fill="#4f46e5"/>
  <rect x="8" y="6" width="18" height="8" fill="#ffffff" opacity="0.85"/>
  <rect x="70" y="7" width="42" height="6" fill="#ffffff" opacity="0.85"/>
  <!-- Adressblock links (4 Zeilen) -->
  <g fill="#9ca3af">
    <rect x="8" y="30" width="36" height="2"/>
    <rect x="8" y="35" width="30" height="2"/>
    <rect x="8" y="40" width="32" height="2"/>
    <rect x="8" y="45" width="24" height="2"/>
  </g>
  <!-- Infoblock rechts als Karte -->
  <rect x="70" y="28" width="42" height="26" rx="2" fill="#f3f4f6"/>
  <g fill="#9ca3af">
    <rect x="74" y="32" width="34" height="2"/>
    <rect x="74" y="37" width="30" height="2"/>
    <rect x="74" y="42" width="32" height="2"/>
    <rect x="74" y="47" width="26" height="2"/>
  </g>
  <!-- Tabellenkopf: heller Balken -->
  <rect x="8" y="70" width="104" height="8" fill="#f3f4f6"/>
  <!-- 6 Positionszeilen mit Zebrastreifen -->
  <rect x="8" y="86" width="104" height="8" fill="#fafafa"/>
  <rect x="8" y="102" width="104" height="8" fill="#fafafa"/>
  <rect x="8" y="118" width="104" height="8" fill="#fafafa"/>
  <g fill="#374151">
    <rect x="8" y="82" width="60" height="2"/>
    <rect x="8" y="90" width="55" height="2"/>
    <rect x="8" y="98" width="62" height="2"/>
    <rect x="8" y="106" width="50" height="2"/>
    <rect x="8" y="114" width="58" height="2"/>
    <rect x="8" y="122" width="52" height="2"/>
  </g>
  <g fill="#9ca3af">
    <rect x="92" y="82" width="20" height="2"/>
    <rect x="92" y="90" width="20" height="2"/>
    <rect x="92" y="98" width="20" height="2"/>
    <rect x="92" y="106" width="20" height="2"/>
    <rect x="92" y="114" width="20" height="2"/>
    <rect x="92" y="122" width="20" height="2"/>
  </g>
  <!-- Summen rechts (Linie in Primaerfarbe) -->
  <line x1="76" y1="131" x2="112" y2="131" stroke="#4f46e5" stroke-width="1.2"/>
  <rect x="76" y="134" width="36" height="2" fill="#9ca3af"/>
  <rect x="76" y="139" width="36" height="2.5" fill="#1f2937"/>
  <!-- Fusszeile: heller Balken mit Linie in Primaerfarbe, vier Spalten -->
  <rect x="0" y="150" width="120" height="20" fill="#f3f4f6"/>
  <line x1="8" y1="150" x2="112" y2="150" stroke="#4f46e5" stroke-width="1"/>
  <g fill="#6b7280">
    <rect x="8" y="154" width="20" height="1.5"/>
    <rect x="8" y="158" width="18" height="1.5"/>
    <rect x="34" y="154" width="20" height="1.5"/>
    <rect x="34" y="158" width="18" height="1.5"/>
    <rect x="60" y="154" width="20" height="1.5"/>
    <rect x="60" y="158" width="18" height="1.5"/>
    <rect x="86" y="154" width="20" height="1.5"/>
    <rect x="86" y="158" width="18" height="1.5"/>
  </g>
</svg>
